<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Valentine 💖</title>

<style>
:root{
  --bg1:#ffb3c6;
  --bg2:#ffe5ec;
  --yes:#ff4d6d;
  --text:#111;
}
*{box-sizing:border-box;}

body{
  margin:0;
  height:100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,var(--bg1),var(--bg2));
  overflow:hidden;
}

/* HEADER */
.header{
  padding:22px 16px 6px;
  text-align:center;
}

.question{
  margin:0;
  font-size:clamp(26px,4vw,54px);
  font-weight:900;
}

.dare{
  margin:10px 0 0;
  font-size:clamp(20px,3vw,40px);
  font-weight:900;
}

/* TAUNT */
.taunt{
  margin:12px auto 0;
  padding:12px 18px;
  border-radius:999px;
  background:rgba(255,255,255,.65);
  box-shadow:0 10px 24px rgba(0,0,0,.1);
  font-weight:900;
  font-size:clamp(16px,2vw,22px);
  opacity:0;
  transform:translateY(-8px) scale(.95);
  pointer-events:none;
}
.taunt.show{
  animation: tauntPop 3s ease forwards;
}
@keyframes tauntPop{
  0%   {opacity:0; transform:translateY(-12px) scale(.95);}
  15%  {opacity:1; transform:translateY(0) scale(1.05);}
  80%  {opacity:1;}
  100% {opacity:0; transform:translateY(-12px) scale(.98);}
}

/* PLAY AREA */
.playarea{
  position:relative;
  width:min(1200px,calc(100vw - 32px));
  height:calc(100vh - 190px);
  min-height:420px;
  margin:14px auto;
  border-radius:24px;
  background:rgba(255,255,255,.22);
  box-shadow:0 18px 45px rgba(0,0,0,.12);
  overflow:hidden;
}

button{
  border:none;
  cursor:pointer;
  font-weight:900;
  border-radius:18px;
  transition:transform .25s ease;
  user-select:none;
  white-space:nowrap;
}

/* YES */
#yes{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(1);
  padding:24px 46px;
  font-size:30px;
  background:var(--yes);
  color:#fff;
  z-index:2;
  box-shadow:0 18px 30px rgba(255,77,109,.35);
}
#yes.pulse{
  animation: heartbeat .75s ease-in-out infinite;
}
@keyframes heartbeat{
  0%{filter:brightness(1);}
  50%{filter:brightness(1.1);}
  100%{filter:brightness(1);}
}

/* NO */
#no{
  position:absolute;
  left:12%;
  top:25%;
  padding:12px 22px;
  font-size:16px;
  background:#f2f2f2;
  z-index:3;
}

/* CONFETTI */
.particle{
  position:absolute;
  pointer-events:none;
  font-size:20px;
  animation:fly 1s ease-out forwards;
}
@keyframes fly{
  from{opacity:1; transform:translate(0,0) scale(1);}
  to{opacity:0; transform:translate(var(--dx),var(--dy)) scale(.8);}
}
</style>
</head>

<body>

<div class="header">
  <h1 class="question">Joya, will you be my Valentine? 💘</h1>
  <h2 class="dare">Tap “NO” if you dare 😈</h2>
  <div class="taunt" id="taunt"></div>
</div>

<div class="playarea" id="playarea">
  <button id="yes">YES 💖</button>
  <button id="no">NO 🙄</button>
</div>

<script>
(() => {
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");
  const play = document.getElementById("playarea");
  const taunt = document.getElementById("taunt");

  const taunts = [
    "Bold of you to try 😌",
    "Absolutely not 😒",
    "Let’s not pretend 🙄",
    "You’re delaying the inevitable 😈",
    "Okay stop fighting destiny 💘"
  ];

  let t = 0, yesScale = 1, noScale = 1;
  const safeGap = 120;

  function showTaunt(){
    taunt.textContent = taunts[Math.min(t, taunts.length-1)];
    t++;
    taunt.classList.remove("show");
    void taunt.offsetWidth;
    taunt.classList.add("show");
  }

  function placeNo(){
    const pr = play.getBoundingClientRect();
    const yr = yesBtn.getBoundingClientRect();
    const w = noBtn.offsetWidth * noScale;
    const h = noBtn.offsetHeight * noScale;

    const minX = 18;
    const maxX = pr.width - w - 36;

    // 🔥 KEY FIX: TOP-ONLY ZONE (never touches Safari bar)
    const minY = 18;
    const maxY = pr.height * 0.45;

    for(let i=0;i<140;i++){
      const x = minX + Math.random()*maxX;
      const y = minY + Math.random()*(maxY - minY);

      const overlap = !(
        x+w < yr.left-pr.left-safeGap ||
        x > yr.right-pr.left+safeGap ||
        y+h < yr.top-pr.top-safeGap ||
        y > yr.bottom-pr.top+safeGap
      );

      if(!overlap){
        noBtn.style.left = x+"px";
        noBtn.style.top = y+"px";
        return;
      }
    }
  }

  function onNo(e){
    e.preventDefault();
    showTaunt();

    yesScale = Math.min(yesScale + 0.55, 6);
    noScale = Math.max(noScale * 0.78, 0.14);

    yesBtn.style.transform = `translate(-50%,-50%) scale(${yesScale})`;
    noBtn.style.transform = `scale(${noScale})`;

    if(yesScale >= 3.2) yesBtn.classList.add("pulse");
    requestAnimationFrame(placeNo);
  }

  noBtn.addEventListener("pointerdown", onNo, {passive:false});
  noBtn.addEventListener("pointerenter", e=>{
    if(e.pointerType==="mouse") onNo(e);
  });

  function explode(x,y){
    const icons=["💖","💘","💞","💓","✨","🎉","💕"];
    for(let i=0;i<36;i++){
      const p=document.createElement("div");
      p.className="particle";
      p.textContent=icons[Math.floor(Math.random()*icons.length)];
      const a=Math.random()*Math.PI*2;
      const d=80+Math.random()*180;
      p.style.left=x+"px";
      p.style.top=y+"px";
      p.style.setProperty("--dx",Math.cos(a)*d+"px");
      p.style.setProperty("--dy",Math.sin(a)*d-60+"px");
      play.appendChild(p);
      setTimeout(()=>p.remove(),1000);
    }
  }

  const personalLine = "Feb 14 is ours. Dinner on me 💌";

  yesBtn.addEventListener("click",e=>{
    const r=play.getBoundingClientRect();
    explode(
      (e.clientX||r.width/2)-r.left,
      (e.clientY||r.height/2)-r.top
    );

    setTimeout(()=>{
      document.body.innerHTML=`
      <div style="height:100vh;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,#ffb3c6,#ffe5ec);text-align:center;padding:30px;">
        <div style="background:white;padding:44px 28px;border-radius:22px;
        box-shadow:0 20px 50px rgba(0,0,0,.18);max-width:820px;">
          <h1 style="font-size:54px;margin:0 0 10px;">YAY 💖</h1>
          <p style="font-size:22px;font-weight:900;margin:0 0 12px;">
            You’re my Valentine 😘
          </p>
          <p style="font-size:18px;font-weight:800;opacity:.85;">${personalLine}</p>
        </div>
      </div>`;
    },260);
  });

  placeNo();
})();
</script>

</body>
</html>
