<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Valentine 💖</title>
  <style>
    body{
      height:100vh; margin:0;
      display:flex; justify-content:center; align-items:center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffb3c6, #ffe5ec);
      padding: 18px;
    }
    .card{
      background:#fff;
      width:min(420px, 100%);
      padding:34px 22px 60px;
      border-radius:18px;
      text-align:center;
      position:relative;
      box-shadow:0 18px 40px rgba(0,0,0,.16);
      overflow:hidden;
    }
    h2{ margin:0 0 22px; }
    .btns{
      display:flex; gap:14px;
      justify-content:center; align-items:center;
      margin-top:12px;
    }
    button{
      padding:14px 26px;
      font-size:16px;
      border-radius:12px;
      border:none;
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
      user-select:none;
      touch-action: manipulation;
      font-weight:700;
    }
    #yes{
      background:#ff4d6d;
      color:#fff;
      transition: transform .15s ease;
    }
    #no{
      background:#e9e9e9;
      position:absolute;
      left: 60%;
      top: 72%;
    }
    .hint{
      font-size:13px;
      opacity:.7;
      margin-top:14px;
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <h2>Joya, will you be my Valentine? 💘</h2>

    <div class="btns">
      <button id="yes">YES 💖</button>
    </div>

    <button id="no">NO 🙄</button>
    <div class="hint">Tap “NO” if you dare 😈</div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const card  = document.getElementById("card");
    let noCount = 0;

    function moveNoButton() {
      const padding = 12;
      const cardRect = card.getBoundingClientRect();
      const btnRect  = noBtn.getBoundingClientRect();

      const maxX = cardRect.width  - btnRect.width  - padding;
      const maxY = cardRect.height - btnRect.height - padding;

      const x = Math.max(padding, Math.random() * maxX);
      const y = Math.max(padding, Math.random() * maxY);

      noBtn.style.left = x + "px";
      noBtn.style.top  = y + "px";

      noCount++;
      const scale = Math.min(1 + noCount * 0.06, 1.6);
      yesBtn.style.transform = `scale(${scale})`;
    }

    ["touchstart", "click"].forEach(evt => {
      noBtn.addEventListener(evt, (e) => {
        e.preventDefault();
        moveNoButton();
      }, { passive: false });
    });

    yesBtn.addEventListener("click", () => {
      document.body.innerHTML = `
        <div style="
          height:100vh;margin:0;
          display:flex;justify-content:center;align-items:center;
          font-family:Arial,sans-serif;
          background:#ffccd5;text-align:center;padding:20px;">
          <div>
            <h1 style="margin:0 0 10px;">YAY 💖</h1>
            <p style="font-size:18px;margin:0;">See you on Valentine’s 😘</p>
          </div>
        </div>
      `;
    });

    moveNoButton();
  </script>

</body>
</html>
