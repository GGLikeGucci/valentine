<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Valentine 💖</title>
  <style>
    :root{
      --bg1:#ffb3c6;
      --bg2:#ffe5ec;
      --yes:#ff4d6d;
      --text:#111;
    }
    *{ box-sizing:border-box; }

    body{
      height:100vh; margin:0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      overflow:hidden;
    }

    .stage{
      height:100vh; width:100vw;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      padding: 24px 16px 16px;
      text-align:center;
    }

    .question{
      margin:0;
      font-size: clamp(26px, 4vw, 54px);
      font-weight: 900;
      color: var(--text);
      letter-spacing: .4px;
      text-shadow: 0 2px 0 rgba(255,255,255,.55);
    }

    .dare{
      margin: 12px 0 6px;
      font-size: clamp(20px, 3vw, 40px);
      font-weight: 900;
      color: var(--text);
      opacity: .95;
    }

    .sub{
      margin: 6px 0 0;
      font-size: 14px;
      opacity: .75;
      font-weight: 700;
    }

    .playarea{
      position:relative;
      width: min(1200px, 100vw);
      flex: 1;
      margin-top: 18px;
      border-radius: 22px;
      background: rgba(255,255,255,0.22);
      box-shadow: 0 18px 45px rgba(0,0,0,.10);
      overflow:hidden;
      touch-action: manipulation; /* helps iOS */
    }

    button{
      border:none;
      cursor:pointer;
      font-weight: 900;
      -webkit-tap-highlight-color: transparent;
      user-select:none;
      transition: transform 0.22s ease, filter 0.22s ease;
      border-radius: 18px;
      touch-action: manipulation;
    }

    #yes{
      position:absolute;
      left:50%;
      top:50%;
      transform: translate(-50%,-50%) scale(1);
      padding: clamp(18px, 2.3vw, 28px) clamp(28px, 3vw, 44px);
      font-size: clamp(18px, 2.4vw, 34px);
      background: var(--yes);
      color:#fff;
      box-shadow: 0 18px 30px rgba(255,77,109,.35);
      z-index: 2; /* IMPORTANT: below NO */
    }

    #no{
      position:absolute;
      left: 12%;
      top: 75%;
      padding: 12px 22px;
      font-size: 16px;
      background: #f2f2f2;
      color:#111;
      box-shadow: 0 12px 22px rgba(0,0,0,.12);
      transform: scale(1);
      z-index: 3; /* IMPORTANT: always above YES */
    }
  </style>
</head>
<body>

  <div class="stage">
    <h1 class="question">Joya, will you be my Valentine? 💘</h1>
    <h2 class="dare">Tap “NO” if you dare 😈</h2>
    <div class="sub">Works on iPhone — NO runs away on tap</div>

    <div class="playarea" id="playarea">
      <button id="yes">YES 💖</button>
      <button id="no">NO 🙄</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const play  = document.getElementById("playarea");

    let yesScale = 1;
    let noScale = 1;

    function randomizeNoPosition() {
      const padding = 18;
      const playRect = play.getBoundingClientRect();

      // visible size after scaling
      const btnW = noBtn.offsetWidth * noScale;
      const btnH = noBtn.offsetHeight * noScale;

      const maxX = Math.max(padding, playRect.width  - btnW - padding);
      const maxY = Math.max(padding, playRect.height - btnH - padding);

      const x = Math.max(padding, Math.random() * maxX);
      const y = Math.max(padding, Math.random() * maxY);

      noBtn.style.left = x + "px";
      noBtn.style.top  = y + "px";
    }

    function onNoTriggered(e){
      if (e) e.preventDefault();

      // DRAMATIC: YES grows fast, NO shrinks
      yesScale = Math.min(yesScale * 2, 14);
      noScale  = Math.max(noScale * 0.7, 0.12);

      yesBtn.style.transform = `translate(-50%, -50%) scale(${yesScale})`;
      noBtn.style.transform  = `scale(${noScale})`;

      // move NO after transforms
      requestAnimationFrame(randomizeNoPosition);
    }

    // Desktop “feels interactive”: moves when hovered
    noBtn.addEventListener("pointerenter", (e) => {
      if (e.pointerType === "mouse") onNoTriggered(e);
    });

    // iPhone + touch: runs away on tap (pointerdown is reliable on iOS)
    noBtn.addEventListener("pointerdown", onNoTriggered, { passive: false });

    yesBtn.addEventListener("click", () => {
      document.body.innerHTML = `
        <div style="
          height:100vh;
          display:flex;
          justify-content:center;
          align-items:center;
          font-family:Arial,sans-serif;
          background: linear-gradient(135deg, #ffb3c6, #ffe5ec);
          text-align:center;
          padding:30px;">
          <div style="
            background:white;
            padding:44px 28px;
            border-radius:22px;
            box-shadow:0 20px 50px rgba(0,0,0,.18);
            max-width:760px;
            width:100%;
          ">
            <h1 style="margin:0 0 10px;font-size:54px;font-weight:900;">YAY 💖</h1>
            <p style="margin:0;font-size:22px;font-weight:900;">You’re my Valentine 😘</p>
          </div>
        </div>
      `;
    });

    // Initial placement WITHOUT changing scales
    randomizeNoPosition();
  </script>

</body>
</html>
