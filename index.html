<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Valentine 💖</title>
  <style>
    body{
      height:100vh; margin:0;
      display:flex; justify-content:center; align-items:center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffb3c6, #ffe5ec);
      padding: 18px;
    }

    .card{
      background:#fff;
      width:min(420px, 100%);
      padding:34px 22px 70px;
      border-radius:18px;
      text-align:center;
      position:relative;
      box-shadow:0 18px 40px rgba(0,0,0,.16);
      overflow:hidden;
    }

    h2{ margin:0 0 18px; }

    .btns{
      display:flex;
      justify-content:center;
      gap:14px;
      margin-top:14px;
    }

    button{
      padding:14px 26px;
      font-size:16px;
      border-radius:12px;
      border:none;
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
      user-select:none;
      touch-action: manipulation;
      font-weight:700;
      transition: transform 0.25s ease;
    }

    #yes{
      background:#ff4d6d;
      color:#fff;
      transform-origin:center;
    }

    #no{
      background:#e9e9e9;
      position:absolute;
      left: 60%;
      top: 72%;
      transform-origin:center;
    }

    .hint{
      font-size:13px;
      opacity:.7;
      margin-top:14px;
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <h2>Joya, will you be my Valentine? 💘</h2>

    <div class="btns">
      <button id="yes">YES 💖</button>
    </div>

    <button id="no">NO 🙄</button>
    <div class="hint">Tap “NO” if you dare 😈</div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const card  = document.getElementById("card");

    let yesScale = 1;
    let noScale = 1;

    function moveNoButton() {
      const padding = 12;

      // Use the card's inner box for positioning
      const cardRect = card.getBoundingClientRect();

      // Move first, then measure size (more stable on iOS)
      // Growth/shrink (drastic)
      yesScale = Math.min(yesScale * 2, 10);      // doubles each NO
      noScale  = Math.max(noScale * 0.7, 0.18);   // shrinks each NO

      yesBtn.style.transform = `scale(${yesScale})`;
      noBtn.style.transform  = `scale(${noScale})`;

      // After scaling, compute button size as it appears
      const btnW = noBtn.offsetWidth * noScale;
      const btnH = noBtn.offsetHeight * noScale;

      const maxX = cardRect.width  - btnW - padding;
      const maxY = cardRect.height - btnH - padding;

      const x = Math.max(padding, Math.random() * maxX);
      const y = Math.max(padding + 40, Math.random() * maxY); // keep away from title a bit

      noBtn.style.left = x + "px";
      noBtn.style.top  = y + "px";
    }

    // iOS-friendly: run away on touch/tap
    ["touchstart", "click"].forEach(evt => {
      noBtn.addEventListener(evt, (e) => {
        e.preventDefault();
        moveNoButton();
      }, { passive: false });
    });

    yesBtn.addEventListener("click", () => {
      document.body.innerHTML = `
        <div style="
          height:100vh;margin:0;
          display:flex;justify-content:center;align-items:center;
          font-family:Arial,sans-serif;
          background:#ffccd5;text-align:center;padding:20px;">
          <div>
            <h1 style="margin:0 0 10px;">YAY 💖</h1>
            <p style="font-size:18px;margin:0;">
              You’re my Valentine 😘
            </p>
          </div>
        </div>
      `;
    });

    // Start with a random spot
    moveNoButton();
  </script>

</body>
</html>
