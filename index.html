<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Valentine 💖</title>

  <style>
    :root{
      --bg1:#ffb3c6;
      --bg2:#ffe5ec;
      --yes:#ff4d6d;
      --text:#111;
    }
    *{ box-sizing:border-box; }

    body{
      margin:0;
      height:100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      overflow:hidden;
    }

    .header{
      padding: 22px 16px 10px;
      text-align:center;
      position: relative;
    }

    .question{
      margin:0;
      font-size: clamp(26px, 4vw, 54px);
      font-weight: 900;
      color: var(--text);
    }

    .dare{
      margin: 10px 0 0;
      font-size: clamp(20px, 3vw, 40px);
      font-weight: 900;
    }

    /* Floating taunt text */
    .taunt{
      position:absolute;
      left:50%;
      top:100%;
      transform: translateX(-50%);
      font-size: 22px;
      font-weight: 900;
      opacity: 0;
      pointer-events:none;
    }

    .taunt.show{
      animation: tauntPop 1.1s ease forwards;
    }

    @keyframes tauntPop{
      0%   { opacity:0; transform:translate(-50%, 0) scale(0.9); }
      20%  { opacity:1; transform:translate(-50%, 10px) scale(1.05); }
      70%  { opacity:1; }
      100% { opacity:0; transform:translate(-50%, -12px) scale(0.95); }
    }

    .playarea{
      position:relative;
      width: min(1200px, calc(100vw - 32px));
      height: calc(100vh - 180px);
      min-height: 420px;
      margin: 14px auto;
      border-radius: 24px;
      background: rgba(255,255,255,0.22);
      box-shadow: 0 18px 45px rgba(0,0,0,.10);
      overflow:hidden;
    }

    button{
      border:none;
      cursor:pointer;
      font-weight: 900;
      border-radius: 18px;
      user-select:none;
      transition: transform 0.22s ease;
      touch-action: manipulation;
      white-space: nowrap;
    }

    #yes{
      position:absolute;
      left:50%;
      top:50%;
      transform: translate(-50%,-50%) scale(1);
      padding: 24px 44px;
      font-size: 30px;
      background: var(--yes);
      color:#fff;
      z-index:2;
    }

    #yes.pulse{
      animation: heartbeat 0.75s ease-in-out infinite;
    }

    @keyframes heartbeat{
      0%{ filter:brightness(1); }
      50%{ filter:brightness(1.08); }
      100%{ filter:brightness(1); }
    }

    #no{
      position:absolute;
      left:12%;
      top:75%;
      padding: 12px 22px;
      font-size: 16px;
      background:#f2f2f2;
