<script>
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");
  const card  = document.getElementById("card");

  let noCount = 0;
  let yesScale = 1;
  let noScale = 1;

  function moveNoButton() {
    const padding = 12;
    const cardRect = card.getBoundingClientRect();
    const btnRect  = noBtn.getBoundingClientRect();

    const maxX = cardRect.width  - btnRect.width  - padding;
    const maxY = cardRect.height - btnRect.height - padding;

    const x = Math.max(padding, Math.random() * maxX);
    const y = Math.max(padding, Math.random() * maxY);

    noBtn.style.left = x + "px";
    noBtn.style.top  = y + "px";

    // 🔥 DRAMATIC EFFECTS
    noCount++;

    // YES grows aggressively (doubles-ish)
    yesScale = Math.min(yesScale * 1.8, 6);
    yesBtn.style.transform = `scale(${yesScale})`;

    // NO shrinks
    noScale = Math.max(noScale * 0.75, 0.25);
    noBtn.style.transform = `scale(${noScale})`;
  }

  ["touchstart", "click"].forEach(evt => {
    noBtn.addEventListener(evt, (e) => {
      e.preventDefault();
      moveNoButton();
    }, { passive: false });
  });

  yesBtn.addEventListener("click", () => {
    document.body.innerHTML = `
      <div style="
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        font-family:Arial,sans-serif;
        background:#ffccd5;
        text-align:center;
        padding:20px;">
        <div>
          <h1 style="margin:0 0 10px;">YAY 💖</h1>
          <p style="font-size:18px;margin:0;">
            Guess you had no choice 😌<br>
            Valentine’s is on 💘
          </p>
        </div>
      </div>
    `;
  });

  // initial random placement
  moveNoButton();
</script>
