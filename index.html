<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Valentine 💖</title>
  <style>
    :root{
      --bg1:#ffb3c6;
      --bg2:#ffe5ec;
      --yes:#ff4d6d;
      --text:#111;
    }
    *{ box-sizing:border-box; }

    body{
      height:100vh; margin:0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      overflow:hidden;
    }

    .stage{
      height:100vh; width:100vw;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      padding: 26px 16px 16px;
      text-align:center;
    }

    /* TOP HEADER (as requested) */
    .question{
      margin:0;
      font-size: clamp(26px, 4vw, 54px);
      font-weight: 900;
      color: var(--text);
      letter-spacing: .4px;
      text-shadow: 0 2px 0 rgba(255,255,255,.55);
    }

    /* BIG SUB-HEADER */
    .dare{
      margin: 14px 0 6px;
      font-size: clamp(20px, 3vw, 40px);
      font-weight: 900;
      color: var(--text);
      opacity: .95;
    }

    .sub{
      margin: 6px 0 0;
      font-size: 14px;
      opacity: .75;
      font-weight: 700;
    }

    .playarea{
      position:relative;
      width: min(1200px, 100vw);
      flex: 1;
      margin-top: 18px;
      border-radius: 22px;
      background: rgba(255,255,255,0.22);
      box-shadow: 0 18px 45px rgba(0,0,0,.10);
      overflow:hidden;
    }

    button{
      border:none;
      cursor:pointer;
      font-weight: 900;
      -webkit-tap-highlight-color: transparent;
      user-select:none;
      touch-action: manipulation;
      transition: transform 0.22s ease, filter 0.22s ease;
      border-radius: 18px;
    }

    #yes{
      position:absolute;
      left:50%;
      top:50%;
      transform: translate(-50%,-50%) scale(1);
      padding: clamp(18px, 2.3vw, 28px) clamp(28px, 3vw, 44px);
      font-size: clamp(18px, 2.4vw, 34px);
      background: var(--yes);
      color:#fff;
      box-shadow: 0 18px 30px rgba(255,77,109,.35);
    }

    #no{
      position:absolute;
      left: 12%;
      top: 75%;
      padding: 12px 22px;
      font-size: 16px;
      background: #f2f2f2;
      color:#111;
      box-shadow: 0 12px 22px rgba(0,0,0,.12);
      transform: scale(1);
    }
  </style>
</head>
<body>

  <div class="stage">
    <h1 class="question">Joya, will you be my Valentine? 💘</h1>
    <h2 class="dare">Tap “NO” if you dare 😈</h2>
    <div class="sub">Try on iPhone too — it runs away on tap</div>

    <div class="playarea" id="playarea">
      <button id="yes">YE
