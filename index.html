<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Valentine 💖</title>
  <style>
    :root{
      --bg1:#ffb3c6;
      --bg2:#ffe5ec;
      --yes:#ff4d6d;
      --text:#111;
    }
    *{ box-sizing:border-box; }

    body{
      margin:0;
      height:100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      overflow:hidden;
    }

    /* Header area */
    .header{
      padding: 22px 16px 10px;
      text-align:center;
    }

    .question{
      margin:0;
      font-size: clamp(26px, 4vw, 54px);
      font-weight: 900;
      color: var(--text);
      letter-spacing: .4px;
      text-shadow: 0 2px 0 rgba(255,255,255,.55);
    }

    .dare{
      margin: 12px 0 0;
      font-size: clamp(20px, 3vw, 40px);
      font-weight: 900;
      color: var(--text);
      opacity: .95;
    }

    /* Full-screen play area (explicit height) */
    .playarea{
      position:relative;
      width: min(1200px, calc(100vw - 32px));
      height: calc(100vh - 170px); /* explicit: avoids flex issues */
      min-height: 420px;
      margin: 12px auto 18px;
      border-radius: 24px;
      background: rgba(255,255,255,0.22);
      box-shadow: 0 18px 45px rgba(0,0,0,.10);
      overflow:hidden;
      touch-action: manipulation;
      outline: 2px solid rgba(255,255,255,0.25); /* so you ALWAYS see it */
    }

    button{
      border:none;
      cursor:pointer;
      font-weight: 900;
      -webkit-tap-highlight-color: transparent;
      user-select:none;
      transition: transform 0.22s ease;
      border-radius: 18px;
      touch-action: manipulation;
    }

    #yes{
      position:absolute;
      left:50%;
      top:50%;
      transform: translate(-50%,-50%) scale(1);
      padding: clamp(18px, 2.3vw, 28px) clamp(28px, 3vw, 44px);
      font-size: clamp(18px, 2.4vw, 34px);
      background: var(--yes);
      color:#fff;
      box-shadow: 0 18px 30px rgba(255,77,109,.35);
      z-index: 2;
      transform-origin: center;
      white-space: nowrap;
    }

    #no{
      position:absolute;
      left: 10%;
      top: 75%;
      padding: 12px 22px;
      font-size: 16px;
      background: #f2f2f2;
      color:#111;
      box-shadow: 0 12px 22px rgba(0,0,0,.12);
      transform: scale(1);
      z-index: 3; /* NO always above YES */
      transform-origin: center;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1 class="question">Joya, will you be my Valentine? 💘</h1>
    <h2 class="dare">Tap “NO” if you dare 😈</h2>
  </div>

  <div class="playarea" id="playarea">
    <button id="yes">YES 💖</button>
    <button id="no">NO 🙄</button>
  </div>

  <script>
    // Wrap everything so even if something goes wrong, the page won't "freeze"
    (function () {
      const noBtn = document.getElementById("no");
      const yesBtn = document.getElementById("yes");
      const play  = document.getElementById("playarea");

      let yesScale = 1;
      let noScale  = 1;

      const safeGap = 120; // fat-finger keep-out zone around YES

      function placeNoAwayFromYes() {
        const padding = 18;

        const playRect = play.getBoundingClientRect();
        const yesRect  = yesBtn.getBoundingClientRect();

        // Visible size of NO after scaling
        const btnW = noBtn.offsetWidth * noScale;
        const btnH = noBtn.offsetHeight * noScale;

        const minX = padding;
        const minY = padding;
        const maxX = Math.max(minX, playRect.width  - btnW - padding);
        const maxY = Math.max(minY, playRect.height - btnH - padding);

        // Keep-out zone around YES (expanded)
        const forbidden = {
          left:   (yesRect.left - playRect.left) - safeGap,
          right:  (yesRect.right - playRect.left) + safeGap,
          top:    (yesRect.top - playRect.top) - safeGap,
          bottom: (yesRect.bottom - playRect.top) + safeGap
        };

        for (let i = 0; i < 140; i++) {
          const x = minX + Math.random() * (maxX - minX + 1);
          const y = minY + Math.random() * (maxY - minY + 1);

          const noBox = { left:x, right:x+btnW, top:y, bottom:y+btnH };

          const overlapsForbidden =
            !(noBox.right < forbidden.left ||
              noBox.left  > forbidden.right ||
              noBox.bottom < forbidden.top ||
              noBox.top > forbidden.bottom);

          if (!overlapsForbidden) {
            noBtn.style.left = x + "px";
            noBtn.style.top  = y + "px";
            return;
          }
        }

        // Fallback (corner)
        noBtn.style.left = minX + "px";
        noBtn.style.top  = maxY + "px";
      }

      function onNoTriggered(e) {
        if (e) e.preventDefault();

        // Dramatic growth/shrink
        yesScale = Math.min(yesScale * 2, 14);
        noScale  = Math.max(noScale * 0.7, 0.12);

        yesBtn.style.transform = `translate(-50%, -50%) scale(${yesScale})`;
        noBtn.style.transform  = `scale(${noScale})`;

        requestAnimationFrame(placeNoAwayFromYes);
      }

      // Desktop: run away on hover
      noBtn.addEventListener("pointerenter", (e) => {
        if (e.pointerType === "mouse") onNoTriggered(e);
      });

      // iOS/Touch: run away on tap (pointerdown is reliable)
      noBtn.addEventListener("pointerdown", onNoTriggered, { passive: false });

      // YES click
      yesBtn.addEventListener("click", () => {
        document.body.innerHTML = `
          <div style="
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial,sans-serif;
            background: linear-gradient(135deg, #ffb3c6, #ffe5ec);
            text-align:center;
            padding:30px;">
            <div style="
              background:white;
              padding:44px 28px;
              border-radius:22px;
              box-shadow:0 20px 50px rgba(0,0,0,.18);
              max-width:760px;
              width:100%;
            ">
              <h1 style="margin:0 0 10px;font-size:54px;font-weight:900;">YAY 💖</h1>
              <p style="margin:0;font-size:22px;font-weight:900;">You’re my Valentine 😘</p>
            </div>
          </div>
        `;
      });

      // Initial placement
      placeNoAwayFromYes();

      // Keep it stable when phone rotates / resizes
      window.addEventListener("resize", () => requestAnimationFrame(placeNoAwayFromYes));
    })();
  </script>

</body>
</html>
